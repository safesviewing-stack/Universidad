<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;

/* ============================= DATA ============================= */

const UNIVERSITIES = [
  { id: 'upv-vera', short: 'UPV', name: 'Universitat Politècnica de València', campus: 'Campus de Vera', lat: 39.4817, lng: -0.3467, color: '#FF6A3D' },
  { id: 'uv-blasco', short: 'UV', name: 'Universitat de València', campus: 'Blasco Ibáñez', lat: 39.4763, lng: -0.3630, color: '#2F6DF6' },
  { id: 'uv-tarongers', short: 'UV', name: 'Universitat de València', campus: 'Tarongers', lat: 39.4802, lng: -0.3565, color: '#2F6DF6' },
  { id: 'uv-burjassot', short: 'UV', name: 'Universitat de València', campus: 'Burjassot-Paterna', lat: 39.5079, lng: -0.4165, color: '#2F6DF6' },
  { id: 'uev', short: 'UEV', name: 'Universidad Europea de Valencia', campus: 'Campus Valencia', lat: 39.4712, lng: -0.3550, color: '#9B5DE5' },
  { id: 'ucv', short: 'UCV', name: 'Universidad Católica de Valencia', campus: 'San Vicente Mártir', lat: 39.4735, lng: -0.3735, color: '#F15BB5' },
  { id: 'uiv', short: 'UIV', name: 'Universidad Internacional de Valencia', campus: 'Campus Digital', lat: 39.4650, lng: -0.3780, color: '#00BBA7' },

const UNI_GROUPS = [
  { short:'UPV', label:'UPV — Politècnica', campuses:['upv-vera'] },
  { short:'UV', label:'Universitat de València', campuses:['uv-blasco','uv-tarongers','uv-burjassot'] },
  { short:'UEV', label:'Europea de Valencia', campuses:['uev'] },
  { short:'UCV', label:'Católica de Valencia', campuses:['ucv'] },
  { short:'UIV', label:'Internacional de Valencia', campuses:['uiv'] },
];

const BARRIOS = [
  { name:'Benimaclet', lat:39.4870, lng:-0.3557 },
  { name:'Algirós', lat:39.4791, lng:-0.3512 },
  { name:'Amistat', lat:39.4735, lng:-0.3625 },
  { name:'Mestalla', lat:39.4770, lng:-0.3735 },
  { name:'Ruzafa', lat:39.4590, lng:-0.3760 },
  { name:'Ciutat Vella', lat:39.4745, lng:-0.3775 },
  { name:'Patraix', lat:39.4610, lng:-0.3915 },
  { name:'Campanar', lat:39.4785, lng:-0.3955 },
  { name:'Blasco Ibáñez', lat:39.4755, lng:-0.3610 },
  { name:'Ayora', lat:39.4830, lng:-0.3700 },
  { name:'Cabanyal', lat:39.4685, lng:-0.3280 },
  { name:'Camins al Grau', lat:39.4650, lng:-0.3395 },
];

const AMENITIES_ALL = [
  { key:'wifi', label:'Internet', icon:'📶' },
  { key:'ac', label:'Aire acondicionado', icon:'❄️' },
  { key:'furnished', label:'Amueblado', icon:'🛋️' },
  { key:'elevator', label:'Ascensor', icon:'🛗' },
  { key:'terrace', label:'Terraza', icon:'🌿' },
  { key:'erasmus', label:'Erasmus friendly', icon:'🌍' },
];

function seededRandom(seed) {
  let s = seed;
  return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
}

function generateListings() {
  const rnd = seededRandom(42);
  const listings = [];
  const types = ['Habitación individual', 'Habitación compartida', 'Piso completo'];
  const photos = ['🏠','🏘️','🏢','🏡'];
  let id = 1;
  BARRIOS.forEach((barrio) => {
    const count = 3 + Math.floor(rnd() * 3);
    for (let i = 0; i < count; i++) {
      const lat = barrio.lat + (rnd() - 0.5) * 0.012;
      const lng = barrio.lng + (rnd() - 0.5) * 0.012;
      const price = 320 + Math.floor(rnd() * 550);
      const rooms = 1 + Math.floor(rnd() * 4);
      const type = types[Math.floor(rnd() * types.length)];
      const amenities = {};
      AMENITIES_ALL.forEach(a => amenities[a.key] = rnd() > 0.42);
      const nearestUni = UNIVERSITIES[Math.floor(rnd() * UNIVERSITIES.length)];
      const minStay = [3,6,9,12][Math.floor(rnd()*4)];
      const daysAgo = Math.floor(rnd() * 60);
      const availableIn = Math.floor(rnd() * 45);
      listings.push({
        id: id++,
        title: `${type} en ${barrio.name}`,
        barrio: barrio.name,
        price, rooms, type,
        lat, lng,
        amenities,
        photo: photos[Math.floor(rnd()*photos.length)],
        rating: 70 + Math.floor(rnd() * 28),
        nearestUniId: nearestUni.id,
        minStay,
        utilitiesIncluded: rnd() > 0.5,
        availableFrom: new Date(Date.now() + availableIn*86400000),
        description: `Alojamiento de ejemplo en ${barrio.name}, pensado para estudiantes. Ambiente tranquilo, buena conexión de transporte y a un paseo de zonas con vida universitaria. (Datos ficticios de demostración.)`,
        source: 'Demo — PisoCampus',
      });
    }
  });
  return listings;
}
const LISTINGS = generateListings();

/* ============================= HELPERS ============================= */

function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLng = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function timesFor(distanceKm) {
  return {
    walk: Math.max(3, Math.round(distanceKm / 4.5 * 60)),
    bike: Math.max(2, Math.round(distanceKm / 15 * 60)),
    bus: Math.max(4, Math.round(distanceKm / 18 * 60) + 4),
    metro: Math.max(3, Math.round(distanceKm / 28 * 60) + 3),
  };
}
function bestTime(t) { return Math.min(t.walk, t.bike, t.bus, t.metro); }
function proximityLabel(minMinutes) {
  if (minMinutes <= 10) return { label: 'Muy cerca', color: '#1FA97D', dot:'🟢' };
  if (minMinutes <= 20) return { label: 'Bien situado', color: '#F2A93B', dot:'🟡' };
  return { label: 'Algo lejos', color: '#E4572E', dot:'🔴' };
}
function scoreListing(listing, uni, prefs) {
  const dist = haversine(uni.lat, uni.lng, listing.lat, listing.lng);
  const t = timesFor(dist);
  const bt = bestTime(t);
  const distScore = Math.max(0, 100 - bt * 2.2);
  const priceScore = Math.max(0, 100 - Math.max(0, listing.price - 300) / 7);
  const transportScore = Math.max(0, 100 - (Math.min(t.bus, t.metro) * 1.6));
  const amenCount = Object.values(listing.amenities).filter(Boolean).length;
  const featScore = Math.min(100, amenCount * 16 + listing.rating * 0.2);
  const wDist = prefs?.wDist ?? 0.32, wPrice = prefs?.wPrice ?? 0.30, wTrans = prefs?.wTrans ?? 0.18, wFeat = prefs?.wFeat ?? 0.20;
  const total = distScore*wDist + priceScore*wPrice + transportScore*wTrans + featScore*wFeat;
  return {
    total: Math.round(Math.max(0, Math.min(100, total))),
    breakdown: {
      price: Math.round(priceScore/10),
      distance: Math.round(distScore/10),
      transport: Math.round(transportScore/10),
      features: Math.round(featScore/10),
    },
    times: t, bestTime: bt, distanceKm: dist,
  };
}
function euro(n) { return n.toLocaleString('es-ES') + ' €'; }
function uniById(id) { return UNIVERSITIES.find(u => u.id === id); }

/* ============================= MAP (SVG) ============================= */

const MAP_BOUNDS = { minLat: 39.455, maxLat: 39.512, minLng: -0.420, maxLng: -0.322 };
function toXY(lat, lng, w, h) {
  const x = ((lng - MAP_BOUNDS.minLng) / (MAP_BOUNDS.maxLng - MAP_BOUNDS.minLng)) * w;
  const y = h - ((lat - MAP_BOUNDS.minLat) / (MAP_BOUNDS.maxLat - MAP_BOUNDS.minLat)) * h;
  return [x, y];
}

function CityMap({ listings, selectedUni, selectedListing, onSelectListing, height=420 }) {
  const w = 700, h = height;
  return (
    <div className="relative w-full rounded-2xl overflow-hidden border border-stone-200 bg-[#EFF3EC]">
      <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-full block" style={{minHeight: height}}>
        <rect width={w} height={h} fill="#EFF3EC" />
        {[...Array(10)].map((_,i)=>(
          <line key={'v'+i} x1={i*w/10} y1="0" x2={i*w/10} y2={h} stroke="#DCE3D8" strokeWidth="1" />
        ))}
        {[...Array(7)].map((_,i)=>(
          <line key={'h'+i} x1="0" y1={i*h/7} x2={w} y2={i*h/7} stroke="#DCE3D8" strokeWidth="1" />
        ))}
        {/* route line */}
        {selectedListing && selectedUni && (() => {
          const [x1,y1] = toXY(selectedListing.lat, selectedListing.lng, w, h);
          const [x2,y2] = toXY(selectedUni.lat, selectedUni.lng, w, h);
          return <line x1={x1} y1={y1} x2={x2} y2={y2} stroke="#FF6A3D" strokeWidth="2.5" strokeDasharray="6 5" />;
        })()}
        {/* listings */}
        {listings.map((l) => {
          const [x,y] = toXY(l.lat, l.lng, w, h);
          const isSel = selectedListing && selectedListing.id === l.id;
          return (
            <g key={l.id} transform={`translate(${x},${y})`} onClick={() => onSelectListing(l)} className="cursor-pointer">
              <circle r={isSel ? 9 : 6} fill={isSel ? '#FF6A3D' : '#2B2B26'} stroke="white" strokeWidth="2" className={isSel ? 'pulse-marker' : ''} opacity={isSel ? 1 : 0.75} />
            </g>
          );
        })}
        {/* universities */}
        {UNIVERSITIES.map((u) => {
          const [x,y] = toXY(u.lat, u.lng, w, h);
          const isSel = selectedUni && selectedUni.id === u.id;
          return (
            <g key={u.id} transform={`translate(${x},${y})`}>
              <rect x={-16} y={-11} width="32" height="20" rx="6" fill={u.color} opacity={isSel ? 1 : 0.85} stroke="white" strokeWidth={isSel ? 2 : 1} />
              <text x="0" y="4" textAnchor="middle" fontSize="9" fontWeight="700" fill="white">{u.short}</text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

/* ============================= SHARED UI ============================= */

function Badge({ children, className='' }) {
  return <span className={`inline-flex items-center gap-1 text-xs font-semibold px-2.5 py-1 rounded-full ${className}`}>{children}</span>;
}

function ScoreRing({ score, size=56 }) {
  const color = score >= 85 ? '#1FA97D' : score >= 65 ? '#F2A93B' : '#E4572E';
  const r = (size-8)/2, c = 2*Math.PI*r;
  const dash = c * score/100;
  return (
    <div className="relative" style={{width:size, height:size}}>
      <svg width={size} height={size}>
        <circle cx={size/2} cy={size/2} r={r} stroke="#EDEAE1" strokeWidth="6" fill="none" />
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth="6" fill="none" strokeDasharray={`${dash} ${c}`} strokeLinecap="round" transform={`rotate(-90 ${size/2} ${size/2})`} />
      </svg>
      <div className="absolute inset-0 flex items-center justify-center text-xs font-bold" style={{color}}>{score}</div>
    </div>
  );
}

function TransportRow({ t }) {
  return (
    <div className="grid grid-cols-4 gap-2 text-center">
      <div className="bg-white rounded-lg py-1.5 border border-stone-100"><div className="text-sm">🚶</div><div className="text-xs font-semibold text-stone-700">{t.walk}m</div></div>
      <div className="bg-white rounded-lg py-1.5 border border-stone-100"><div className="text-sm">🚲</div><div className="text-xs font-semibold text-stone-700">{t.bike}m</div></div>
      <div className="bg-white rounded-lg py-1.5 border border-stone-100"><div className="text-sm">🚌</div><div className="text-xs font-semibold text-stone-700">{t.bus}m</div></div>
      <div className="bg-white rounded-lg py-1.5 border border-stone-100"><div className="text-sm">🚇</div><div className="text-xs font-semibold text-stone-700">{t.metro}m</div></div>
    </div>
  );
}

/* ============================= LISTING CARD ============================= */

              <p className="text-[11px] text-stone-400">/mes</p>
            </div>
          </div>

          <div className="flex flex-wrap gap-1.5 my-2.5">
            {AMENITIES_ALL.filter(a => listing.amenities[a.key]).slice(0,4).map(a => (
              <Badge key={a.key} className="bg-stone-50 text-stone-600 border border-stone-100">{a.icon} {a.label}</Badge>
            ))}

          <div className="bg-stone-50 rounded-xl p-2.5 mb-2.5">
            <div className="flex items-center justify-between mb-1.5">
              <p className="text-xs font-semibold text-stone-600">📍 Hasta {uni.short} ({uni.campus})</p>
              <span className="text-xs font-semibold" style={{color: prox.color}}>{prox.dot} {prox.label}</span>
            </div>
            <TransportRow t={s.times} />

          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2">
              <ScoreRing score={s.total} size={40} />
              <div className="text-xs">
                <p className="font-bold text-stone-800">{s.total}/100</p>
                <p className="text-stone-400">para ti</p>
              </div>
            </div>
            <div className="flex gap-2">
              <button onClick={() => toggleCompare(listing.id)} className={`w-9 h-9 rounded-full border flex items-center justify-center transition ${isCompared ? 'bg-indigo-500 border-indigo-500 text-white' : 'border-stone-200 text-stone-500 hover:bg-stone-50'}`} title="Comparar">⚖️</button>
              <button onClick={() => toggleFav(listing.id)} className={`w-9 h-9 rounded-full border flex items-center justify-center transition ${isFav ? 'bg-rose-500 border-rose-500 text-white pop-in' : 'border-stone-200 text-stone-500 hover:bg-stone-50'}`} title="Favorito">❤</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================= SEARCH ============================= */

function SearchPage({ initial, favorites, toggleFav, compareSet, toggleCompare, onOpen, goCompare }) {
  const [filters, setFilters] = useState({
    uniId: initial?.uniId || 'upv-vera',
    maxPrice: initial?.price || 1000,
    type: 'all',
    barrio: 'all',
    maxTime: 60,
    furnished: 'all',
    ac: false, elevator: false, terrace: false, wifi: false, erasmus: false,
    minStay: 0,
  });
  const [showFilters, setShowFilters] = useState(false);
  const uni = uniById(filters.uniId);

  const results = useMemo(() => {
    return LISTINGS
      .map(l => ({ l, s: scoreListing(l, uni) }))
      .filter(({l,s}) => l.price <= filters.maxPrice)
      .filter(({l}) => filters.type === 'all' || l.type === filters.type)
      .filter(({l}) => filters.barrio === 'all' || l.barrio === filters.barrio)
      .filter(({s}) => s.bestTime <= filters.maxTime)
      .filter(({l}) => filters.furnished === 'all' || l.amenities.furnished === (filters.furnished === 'yes'))
      .filter(({l}) => !filters.ac || l.amenities.ac)
      .filter(({l}) => !filters.elevator || l.amenities.elevator)
      .filter(({l}) => !filters.terrace || l.amenities.terrace)
      .filter(({l}) => !filters.wifi || l.amenities.wifi)
      .filter(({l}) => !filters.erasmus || l.amenities.erasmus)
      .filter(({l}) => l.minStay >= filters.minStay)
      .sort((a,b) => b.s.total - a.s.total)
      .map(({l}) => l);
  }, [filters, uni]);

  const set = (k,v) => setFilters(f => ({...f, [k]: v}));

  const FilterPanel = () => (
    <div className="space-y-5">
      <div>
        <label className="text-xs font-bold text-stone-500 uppercase tracking-wide">Universidad</label>
        <select value={filters.uniId} onChange={e=>set('uniId', e.target.value)} className="w-full mt-1.5 p-2.5 border border-stone-200 rounded-xl text-sm bg-white">
          {UNIVERSITIES.map(u => <option key={u.id} value={u.id}>{u.short} — {u.campus}</option>)}
        </select>
      </div>
      <div>
        <label className="text-xs font-bold text-stone-500 uppercase tracking-wide">Precio máximo: {euro(filters.maxPrice)}</label>
        <input type="range" min="300" max="1000" step="10" value={filters.maxPrice} onChange={e=>set('maxPrice', +e.target.value)} className="w-full mt-2" />
      </div>
      <div>
        <label className="text-xs font-bold text-stone-500 uppercase tracking-wide">Tiempo máximo: {filters.maxTime} min</label>
        <input type="range" min="5" max="60" step="5" value={filters.maxTime} onChange={e=>set('maxTime', +e.target.value)} className="w-full mt-2" />
      </div>
      <div>
        <label className="text-xs font-bold text-stone-500 uppercase tracking-wide">Tipo</label>
        <select value={filters.type} onChange={e=>set('type', e.target.value)} className="w-full mt-1.5 p-2.5 border border-stone-200 rounded-xl text-sm bg-white">
          <option value="all">Todos</option>
          <option>Habitación individual</option>
          <option>Habitación compartida</option>
          <option>Piso completo</option>
        </select>
      </div>
      <div>
        <label className="text-xs font-bold text-stone-500 uppercase tracking-wide">Barrio</label>
        <select value={filters.barrio} onChange={e=>set('barrio', e.target.value)} className="w-full mt-1.5 p-2.5 border border-stone-200 rounded-xl text-sm bg-white">
          <option value="all">Todos</option>
          {BARRIOS.map(b => <option key={b.name}>{b.name}</option>)}
        </select>
      </div>
      <div>
        <label className="text-xs font-bold text-stone-500 uppercase tracking-wide">Amueblado</label>
        <select value={filters.furnished} onChange={e=>set('furnished', e.target.value)} className="w-full mt-1.5 p-2.5 border border-stone-200 rounded-xl text-sm bg-white">
          <option value="all">Indiferente</option>
          <option value="yes">Sí</option>
          <option value="no">No</option>
        </select>
      </div>
      <div>
        <label className="text-xs font-bold text-stone-500 uppercase tracking-wide">Estancia mínima</label>
        <select value={filters.minStay} onChange={e=>set('minStay', +e.target.value)} className="w-full mt-1.5 p-2.5 border border-stone-200 rounded-xl text-sm bg-white">
          <option value="0">Cualquiera</option>
          <option value="3">3 meses</option>
          <option value="6">6 meses</option>
          <option value="9">9 meses</option>
          <option value="12">12 meses</option>
        </select>
      </div>
      <div className="grid grid-cols-2 gap-2">
        {[['ac','❄️ A/C'],['elevator','🛗 Ascensor'],['terrace','🌿 Terraza'],['wifi','📶 Internet'],['erasmus','🌍 Erasmus']].map(([k,l]) => (
          <button key={k} onClick={()=>set(k, !filters[k])} className={`text-xs font-semibold py-2 rounded-lg border transition ${filters[k] ? 'bg-orange-50 border-orange-400 text-orange-600' : 'border-stone-200 text-stone-500'}`}>{l}</button>
        ))}
      </div>
    </div>
  );

  return (
    <div className="max-w-6xl mx-auto px-4 py-6">
      <div className="flex items-center justify-between mb-5">
        <div>
          <h1 className="font-bold text-xl text-stone-900">Alojamientos cerca de {uni.short}</h1>

        </div>
        <button onClick={()=>setShowFilters(s=>!s)} className="lg:hidden px-4 py-2 rounded-xl border border-stone-200 text-sm font-semibold">Filtros</button>
      </div>

/* ============================= COMPARE ============================= */

function ComparePage({ compareSet, toggleCompare }) {
  const items = LISTINGS.filter(l => compareSet.has(l.id)).slice(0,3);
  const uni = uniById(items[0]?.nearestUniId || 'upv-vera');
  const rows = items.map(l => ({ l, s: scoreListing(l, uni) }));

  const best = (key, higherBetter=true) => {
    if (!rows.length) return null;
    const vals = rows.map(r => key(r));
    return higherBetter ? Math.max(...vals) : Math.min(...vals);
  };
  const bestPrice = best(r => r.l.price, false);
  const bestTimeMin = best(r => r.s.bestTime, false);
  const bestScore = best(r => r.s.total, true);

  return (
    <div className="max-w-4xl mx-auto px-4 py-6">
      <h1 className="font-bold text-xl text-stone-900 mb-1">Comparar pisos</h1>
      <p className="text-stone-400 text-sm mb-6">Hasta 3 pisos, comparados sobre {uni.short}.</p>
      {items.length === 0 ? (
        <div className="text-center py-16 text-stone-400">
          <p className="text-4xl mb-3">⚖️</p>
          <p>Elige hasta 3 pisos desde el buscador para compararlos aquí.</p>
        </div>
      ) : (
        <div className="overflow-x-auto">
          <table className="w-full bg-white rounded-2xl border border-stone-200 overflow-hidden text-sm">
            <thead>
              <tr className="bg-stone-50">
                <th className="p-3 text-left font-semibold text-stone-500">—</th>
                {rows.map(({l}) => (
                  <th key={l.id} className="p-3 text-center">
                    <p className="font-bold text-stone-800">{l.title}</p>
                    <button onClick={()=>toggleCompare(l.id)} className="text-xs text-rose-500 font-semibold mt-1">Quitar</button>
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              <tr className="border-t border-stone-100">
                <td className="p-3 font-semibold text-stone-500">Precio</td>
                {rows.map(({l}) => <td key={l.id} className={`p-3 text-center font-bold ${l.price===bestPrice ? 'text-emerald-600 bg-emerald-50' : 'text-stone-700'}`}>{euro(l.price)}</td>)}
              </tr>
              <tr className="border-t border-stone-100">
                <td className="p-3 font-semibold text-stone-500">Tiempo a {uni.short}</td>
                {rows.map(({l,s}) => <td key={l.id} className={`p-3 text-center font-bold ${s.bestTime===bestTimeMin ? 'text-emerald-600 bg-emerald-50' : 'text-stone-700'}`}>{s.bestTime} min</td>)}
              </tr>
              <tr className="border-t border-stone-100">
                <td className="p-3 font-semibold text-stone-500">Habitaciones</td>
                {rows.map(({l}) => <td key={l.id} className="p-3 text-center text-stone-700">{l.rooms}</td>)}
              </tr>
              <tr className="border-t border-stone-100">
                <td className="p-3 font-semibold text-stone-500">Metro</td>
                {rows.map(({l,s}) => <td key={l.id} className="p-3 text-center text-stone-700">{s.times.metro} min</td>)}
              </tr>
              <tr className="border-t border-stone-100">
                <td className="p-3 font-semibold text-stone-500">Puntuación</td>
                {rows.map(({l,s}) => <td key={l.id} className={`p-3 text-center font-bold ${s.total===bestScore ? 'text-emerald-600 bg-emerald-50' : 'text-stone-700'}`}>{s.total}</td>)}
              </tr>
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

    { key:'uniId', q:'¿Dónde estudias?', type:'uni' },
    { key:'budget', q:'¿Cuál es tu presupuesto?', type:'range' },
    { key:'maxTime', q:'¿Cuánto quieres tardar como máximo?', type:'time' },
    { key:'type', q:'¿Qué prefieres?', type:'choice', options:['Habitación individual','Habitación compartida','Piso completo'] },
    { key:'priceImportance', q:'¿Cuánto te importa el precio?', type:'choice', options:['Baja','Media','Alta'] },
    { key:'distImportance', q:'¿Cuánto te importa la distancia?', type:'choice', options:['Baja','Media','Alta'] },
  ];

  const runMatch = () => {
    const uni = uniById(answers.uniId);
    const wMap = { Baja: 0.12, Media: 0.22, Alta: 0.36 };
    const prefs = { wPrice: wMap[answers.priceImportance], wDist: wMap[answers.distImportance], wTrans: 0.18, wFeat: 0.16 };
    const scored = LISTINGS
      .filter(l => l.price <= answers.budget + 80)
      .filter(l => l.type === answers.type)
      .map(l => ({ l, s: scoreListing(l, uni, prefs) }))
      .filter(({s}) => s.bestTime <= answers.maxTime + 15)
      .sort((a,b) => b.s.total - a.s.total)
      .slice(0,5);
    setResults({ uni, scored });
    setStep(questions.length);
  };

  if (step >= questions.length) {
    return (
      <div className="max-w-2xl mx-auto px-4 py-6">
        <h1 className="font-bold text-xl text-stone-900 mb-1">🏆 Tus mejores opciones</h1>
        <p className="text-stone-400 text-sm mb-6">Según tus respuestas, para {results.uni.short}.</p>
        <div className="space-y-3">
          {results.scored.map(({l,s}, i) => (
            <div key={l.id} className="bg-white rounded-2xl border border-stone-200 p-4 flex items-center gap-4 fade-in-up" style={{animationDelay:`${i*80}ms`}}>
              <div className="text-2xl font-extrabold text-stone-300 w-8 flex-shrink-0">{i+1}</div>
              <div className="text-3xl bg-orange-50 rounded-xl w-14 h-14 flex items-center justify-center flex-shrink-0">{l.photo}</div>
              <div className="flex-1 min-w-0">
                <p className="font-semibold text-stone-800 truncate">{l.title}</p>
                <p className="text-xs text-stone-400">{euro(l.price)}/mes · {s.bestTime} min a {results.uni.short}</p>
              </div>
              <ScoreRing score={s.total} size={44} />
            </div>
          ))}
          {results.scored.length === 0 && <p className="text-stone-400 text-center py-10">No encontramos pisos que encajen. Prueba a subir el presupuesto.</p>}
        </div>
        <button onClick={() => { setStep(0); setResults(null); }} className="mt-6 text-sm font-semibold text-orange-600">← Volver a empezar</button>
      </div>
    );
  }

  const cur = questions[step];
  return (
    <div className="max-w-xl mx-auto px-4 py-10">
      <p className="text-xs font-bold text-orange-500 uppercase mb-2">Pregunta {step+1} de {questions.length}</p>
      <h1 className="font-bold text-2xl text-stone-900 mb-6">{cur.q}</h1>

      {cur.type === 'uni' && (
        <div className="grid grid-cols-2 gap-2.5">
          {UNIVERSITIES.map(u => (
            <button key={u.id} onClick={() => setAnswers(a=>({...a, uniId:u.id}))} className={`text-left px-3 py-2.5 rounded-xl border-2 ${answers.uniId===u.id ? 'border-orange-500 bg-orange-50' : 'border-stone-100'}`}>
              <p className="font-bold text-sm text-stone-800">{u.short}</p><p className="text-[11px] text-stone-400">{u.campus}</p>
            </button>
          ))}
        </div>
      )}
      {cur.type === 'range' && (
        <div>
          <input type="range" min="300" max="1000" step="10" value={answers.budget} onChange={e=>setAnswers(a=>({...a,budget:+e.target.value}))} className="w-full" />
          <p className="text-center text-orange-600 font-bold mt-2">{euro(answers.budget)}/mes</p>
        </div>
      )}
      {cur.type === 'time' && (
        <div>
          <input type="range" min="5" max="45" step="5" value={answers.maxTime} onChange={e=>setAnswers(a=>({...a,maxTime:+e.target.value}))} className="w-full" />
          <p className="text-center text-orange-600 font-bold mt-2">{answers.maxTime} minutos</p>
        </div>
      )}
      {cur.type === 'choice' && (
        <div className="space-y-2">
          {cur.options.map(o => (
            <button key={o} onClick={() => setAnswers(a=>({...a,[cur.key]:o}))} className={`w-full text-left px-4 py-3 rounded-xl border-2 font-medium ${answers[cur.key]===o ? 'border-orange-500 bg-orange-50 text-orange-600' : 'border-stone-100 text-stone-600'}`}>{o}</button>
          ))}
        </div>
      )}

      <div className="flex justify-between mt-8">
        <button disabled={step===0} onClick={() => setStep(s=>s-1)} className="text-sm font-semibold text-stone-400 disabled:opacity-0">← Atrás</button>
        <button onClick={() => step === questions.length-1 ? runMatch() : setStep(s=>s+1)} className="bg-orange-500 hover:bg-orange-600 text-white font-bold px-6 py-3 rounded-xl transition">
          {step === questions.length-1 ? 'Ver resultados' : 'Siguiente'}
        </button>
      </div>
    </div>
  );
}

/* ============================= STATS ============================= */

function StatsPage() {
  const avgPrice = Math.round(LISTINGS.reduce((s,l)=>s+l.price,0)/LISTINGS.length);
  const byBarrio = {};
  LISTINGS.forEach(l => { byBarrio[l.barrio] = (byBarrio[l.barrio]||[]).concat(l.price); });
  const avgByBarrio = Object.entries(byBarrio).map(([b,arr]) => [b, Math.round(arr.reduce((a,c)=>a+c,0)/arr.length)]);
  const cheapest = avgByBarrio.sort((a,b)=>a[1]-b[1])[0];
  const upv = uniById('upv-vera');
  const closestBarrio = avgByBarrio.map(([b]) => {
    const sample = LISTINGS.find(l=>l.barrio===b);
    return [b, haversine(upv.lat, upv.lng, sample.lat, sample.lng)];
  }).sort((a,b)=>a[1]-b[1])[0];
  const avgTime = Math.round(LISTINGS.reduce((sum,l) => {
    const uni = uniById(l.nearestUniId);
    return sum + scoreListing(l, uni).bestTime;
  }, 0) / LISTINGS.length);

  const maxBarrioPrice = Math.max(...avgByBarrio.map(([,p])=>p));

  return (
    <div className="max-w-4xl mx-auto px-4 py-6">
      <h1 className="font-bold text-xl text-stone-900 mb-1">Valencia para estudiantes</h1>
      <p className="text-stone-400 text-sm mb-6">Datos agregados de nuestro catálogo de ejemplo.</p>

      <div className="grid sm:grid-cols-4 gap-3 mb-8">
        {[
          ['Precio medio habitación', euro(avgPrice)+'/mes', '💰'],
          ['Barrio más cercano a UPV', closestBarrio[0], '📍'],
          ['Barrio más económico', cheapest[0], '💸'],
          ['Tiempo medio a la universidad', avgTime+' min', '⏱️'],
        ].map(([t,v,i]) => (
          <div key={t} className="bg-white rounded-2xl border border-stone-200 p-4 text-center">
            <div className="text-2xl mb-2">{i}</div>
            <p className="text-xs text-stone-400 mb-1">{t}</p>
            <p className="font-bold text-orange-600">{v}</p>
          </div>
        ))}
      </div>

      <h3 className="font-bold text-stone-900 mb-3">Precio medio por barrio</h3>
      <div className="bg-white rounded-2xl border border-stone-200 p-5 space-y-2.5">
        {avgByBarrio.sort((a,b)=>a[1]-b[1]).map(([b,p]) => (
          <div key={b} className="flex items-center gap-3">
            <p className="text-xs text-stone-500 w-28 flex-shrink-0 truncate">{b}</p>
            <div className="flex-1 bg-stone-100 rounded-full h-3">
              <div className="bg-orange-400 h-3 rounded-full transition-all" style={{width: `${(p/maxBarrioPrice)*100}%`}}></div>
            </div>
            <p className="text-xs font-bold text-stone-700 w-14 text-right flex-shrink-0">{p}€</p>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============================= NAV ============================= */

function TopNav({ page, go }) {
  const items = [
    ['home','Inicio'], ['search','Buscar'], ['map','Mapa'], ['universities','Universidades'],
    ['choose','Elige por mí'], ['stats','Datos'], ['favorites','Favoritos'],
  ];
  return (
    <div className="hidden md:flex items-center justify-between px-6 py-3 border-b border-stone-100 bg-white/90 backdrop-blur sticky top-0 z-30">
      <div onClick={()=>go('home')} className="flex items-center gap-2 cursor-pointer">
        <div className="w-8 h-8 rounded-lg bg-orange-500 text-white flex items-center justify-center font-extrabold text-sm">P</div>
        <span className="font-extrabold text-stone-900">PisoCampus <span className="text-orange-500">Valencia</span></span>
      </div>
      <div className="flex gap-1">
        {items.map(([k,l]) => (
          <button key={k} onClick={()=>go(k)} className={`px-3 py-2 rounded-lg text-sm font-semibold transition ${page===k ? 'bg-orange-50 text-orange-600' : 'text-stone-500 hover:bg-stone-50'}`}>{l}</button>
        ))}
      </div>
    </div>
  );
}

function BottomNav({ page, go }) {
  const items = [
    ['home','🏠','Inicio'], ['search','🔎','Buscar'], ['map','🗺️','Mapa'], ['favorites','❤️','Favoritos'], ['choose','👤','Perfil'],
  ];
  return (
    <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-stone-100 flex justify-around px-1 py-2 z-30">
      {items.map(([k,i,l]) => (
        <button key={k} onClick={()=>go(k)} className={`flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl transition ${page===k ? 'text-orange-600' : 'text-stone-400'}`}>
          <span className="text-lg">{i}</span>
          <span className="text-[10px] font-semibold">{l}</span>
        </button>
      ))}
    </div>
  );
}

/* ============================= APP ============================= */

function App() {
  const [page, setPage] = useState('home');
  const [searchParams, setSearchParams] = useState(null);
  const [openListing, setOpenListing] = useState(null);
  const [favorites, setFavorites] = useState(new Set());
  const [compareSet, setCompareSet] = useState(new Set());

  const toggleFav = (id) => setFavorites(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const toggleCompare = (id) => setCompareSet(prev => {
    const n = new Set(prev);
    if (n.has(id)) n.delete(id); else if (n.size < 3) n.add(id);
    return n;
  });

  const go = (p) => { setPage(p); setOpenListing(null); window.scrollTo(0,0); };
  const openDetail = (l) => { setOpenListing(l); window.scrollTo(0,0); };

  let content;
  if (openListing) {
    content = <ListingDetail listing={openListing} favorites={favorites} toggleFav={toggleFav} onBack={()=>setOpenListing(null)} onOpen={openDetail} />;
  } else if (page === 'home') {
    content = <Home onSearch={(p)=>{ setSearchParams(p); setPage('search'); }} />;
  } else if (page === 'search') {
    content = <SearchPage initial={searchParams} favorites={favorites} toggleFav={toggleFav} compareSet={compareSet} toggleCompare={toggleCompare} onOpen={openDetail} goCompare={()=>go('compare')} />;
  } else if (page === 'map') {
    content = <MapPage />;
  } else if (page === 'universities') {
    content = <UniversitiesPage onExplore={(uniId)=>{ setSearchParams({uniId, price:1000, transport:'bus'}); setPage('search'); }} />;
  } else if (page === 'favorites') {
    content = <FavoritesPage favorites={favorites} toggleFav={toggleFav} onOpen={openDetail} />;
  } else if (page === 'compare') {
    content = <ComparePage compareSet={compareSet} toggleCompare={toggleCompare} />;
  } else if (page === 'choose') {
    content = <ChooseForMePage />;
  } else if (page === 'stats') {
    content = <StatsPage />;
  }

  return (
    <div>
      <TopNav page={page} go={go} />
      <div className="pb-20 md:pb-6">{content}</div>
      <BottomNav page={page} go={go} />
      <footer className="hidden md:block text-center text-xs text-stone-300 py-6">
        PisoCampus Valencia — MVP de demostración. Todos los anuncios son ficticios y están marcados como "Ejemplo".
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
